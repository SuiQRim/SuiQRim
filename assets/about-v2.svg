<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="408" viewBox="0 0 1200 408" role="img"><defs><pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse"><path d="M34 0H0V34" fill="none" stroke="#9b734f" stroke-width=".65" opacity=".22"/></pattern><linearGradient id="fade" x1="0" x2="1"><stop stop-color="#ef782c"/><stop offset="1" stop-color="#ffbc6d"/></linearGradient></defs><rect x="0" y="0" width="1200" height="408" rx="14" fill="#f5e1bd" /><rect x="0" y="0" width="1200" height="408" rx="14" fill="url(#grid)" /><rect x="16" y="16" width="1168" height="376" rx="10" fill="none" stroke="#5b3928" stroke-width="2"/><rect x="0" y="0" width="1200" height="28" rx="0" fill="#ef782c" /><path d="M22 29H36L127 124H113Z" fill="#ef782c"/><path d="M48 29H62L153 124H139Z" fill="#f5e1bd"/><path d="M74 29H88L179 124H165Z" fill="#b94729"/><text x="172" y="95" fill="#171613" font-family="Arial,Helvetica,sans-serif" font-size="53" font-weight="900" font-style="italic" letter-spacing="1">01 / THE ENGINEER</text><text x="174" y="131" fill="#5b3928" font-family="Courier New,monospace" font-size="21" font-weight="700"  >РОМАН САМАДИ  •  C# / .NET BACKEND</text><path d="M172 153L795 153" stroke="#b94729" stroke-width="3" fill="none"/><text x="70" y="203" fill="#171613" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="600"  >Мне нравится создавать решения, которые делают жизнь людей</text><text x="70" y="240" fill="#171613" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="600"  >удобнее — и видеть, как код становится настоящим продуктом.</text><text x="70" y="277" fill="#171613" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="600"  >Ценю продуманную архитектуру, понятную логику</text><text x="70" y="314" fill="#171613" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="600"  >и детали, благодаря которым систему легко развивать.</text><rect x="820" y="55" width="336" height="292" rx="11" fill="#171613" /><rect x="840" y="76" width="295" height="251" rx="8" fill="none" stroke="#d8bb93" stroke-width="1"/><circle cx="984" cy="172" r="70" fill="#ef782c"/><path d="M910 175.5L1058 175.5" stroke="#171613" stroke-width="5" fill="none"/><path d="M910 186.5L1058 186.5" stroke="#171613" stroke-width="5" fill="none"/><path d="M910 197.5L1058 197.5" stroke="#171613" stroke-width="5" fill="none"/><path d="M910 208.5L1058 208.5" stroke="#171613" stroke-width="5" fill="none"/><circle cx="984" cy="172" r="90" fill="none" stroke="#d8bb93" opacity=".35"/><text x="844" y="294" fill="#ffae58" font-family="Courier New,monospace" font-size="19" font-weight="800"  >BUILD USEFUL THINGS</text><text x="844" y="316" fill="#f5e1bd" font-family="Courier New,monospace" font-size="18" font-weight="700"  >BUILD THEM WELL.</text><text x="72" y="369" fill="#b94729" font-family="Courier New,monospace" font-size="16" font-weight="700"  letter-spacing="2">SOFTWARE ENGINEERING IS CRAFT</text></svg>